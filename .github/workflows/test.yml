name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
        exclude:
          # One Python per non-Linux runner is enough; the code is pure stdlib.
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (engine frame tests need it)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg || true
          else
            choco install ffmpeg -y --no-progress || true
          fi
          ffmpeg -version | head -1 || echo "ffmpeg unavailable — those tests will skip"

      - name: Install test deps
        run: python -m pip install --quiet --upgrade pip pytest

      - name: learn-from-video suite
        run: python -m pytest tests/test_learn_from_video.py -q

      - name: Full suite (includes vendored engine)
        continue-on-error: true
        run: python -m pytest -q

  docx:
    name: docx builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docx
        run: npm install --no-fund --no-audit docx

      - name: Render a spec and verify it
        run: |
          python - <<'PY'
          import json
          spec = {
            "output": "out.docx",
            "title": "CI Render Test",
            "subtitle": "build_docx.js smoke test",
            "meta": [["Generated by", "CI"]],
            "toc": [["1", "Section One", 3]],
            "sections": [{
              "heading": "1. Section One",
              "blocks": [
                {"type": "ts", "time": "0:30", "text": "A timestamped paragraph with real content in it."},
                {"type": "p", "text": "A plain paragraph."},
                {"type": "bullets", "items": ["first", "second"]},
                {"type": "table", "headers": ["A", "B"], "rows": [["1", "2"]], "widths": [4000, 4000]},
                {"type": "callout", "style": "key", "title": "Key", "body": ["Something important."]},
                {"type": "code", "language": "js", "text": "const x = 1;\nconsole.log(x);"},
                {"type": "spacer"}
              ]
            }]
          }
          open("spec.json", "w", encoding="utf-8").write(json.dumps(spec))
          PY
          node skills/learn-from-video/scripts/build_docx.js spec.json
          test -f out.docx

      - name: Verifier must accept a real file and reject a thin one
        run: |
          python skills/learn-from-video/scripts/verify_docx.py out.docx \
            --min-words 10 --min-images 0 --min-coverage 0 --json
          # a thin document must fail with exit 4
          if python skills/learn-from-video/scripts/verify_docx.py out.docx \
               --min-words 999999 --min-images 0 --min-coverage 0 --json; then
            echo "ERROR: verifier passed a document it should have failed"; exit 1
          else
            echo "verifier correctly rejected the thin document"
          fi

  parity:
    name: vendored engine parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: skills/watch must stay byte-identical to upstream
        run: |
          EXPECTED=a998b18e29c46ecc7d08c4aad90db1cdd757cc7d
          ACTUAL=$(git rev-parse HEAD:skills/watch)
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::skills/watch has diverged from bradautomates/claude-video."
            echo "Fixes belong in skills/learn-from-video/scripts/ as wrappers, so upstream merges stay clean."
            echo "If the divergence is deliberate, update EXPECTED in .github/workflows/test.yml and say why in CHANGELOG.md."
            exit 1
          fi
